name: package upgrades

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: package-upgrades
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-dotnet@v4
        if: runner.environment == 'github-hosted'
        with:
          dotnet-version: 10.0.x
      # Self-hosted runners use their own .NET 10; DOTNET_ROOT lets the test apphosts find it.
      - name: Use the runner's .NET
        if: runner.environment != 'github-hosted'
        run: |
          dotnet --list-sdks | grep -q '^10\.' || { echo "::error::this self-hosted runner has no .NET 10 SDK"; dotnet --list-sdks; exit 1; }
          echo "DOTNET_ROOT=$(dirname "$(readlink -f "$(which dotnet)")")" >> "$GITHUB_ENV"
      - name: Upgrade, build and test
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump-packages.py pdn-fbb.slnx | tee "$RUNNER_TEMP/bump-full.txt"
          dotnet build -c Release
          dotnet test -c Release --no-build --logger "console;verbosity=normal"
      - name: Security fixes only, if the full upgrade failed
        if: steps.full.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard
          git clean -fdx -e .dotnet
          python3 scripts/bump-packages.py pdn-fbb.slnx --vulnerable-only | tee "$RUNNER_TEMP/bump-security.txt"
          dotnet build -c Release
          dotnet test -c Release --no-build --logger "console;verbosity=normal"
      - name: Commit and push to main
        if: success()
        shell: bash
        env:
          FULL_OUTCOME: ${{ steps.full.outcome }}
        run: |
          set -euo pipefail
          if [ "$FULL_OUTCOME" = "failure" ]; then
            subject="chore(deps): security package fixes"
            log="$RUNNER_TEMP/bump-security.txt"
          else
            subject="chore(deps): package upgrades"
            log="$RUNNER_TEMP/bump-full.txt"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "nothing to upgrade"
            exit 0
          fi
          { echo "$subject"; echo; cat "$log"; } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git pull --rebase origin main
          git push origin HEAD:main
